<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0E5135">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blompasset">
  <meta name="description" content="Privat sommarjobbs-dashboard för S-blommor Uddevalla/Kuröd">
  <title>Blompasset</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ═══ PARALLAX-BAKGRUNDSSCEN ═══ -->
  <div class="bg-scene" aria-hidden="true">
    <div class="bg-layer" data-speed="0.06">
      <div class="bg-blob bg-blob-1"></div>
      <div class="bg-blob bg-blob-2"></div>
      <div class="bg-blob bg-blob-3"></div>
    </div>
    <div class="bg-layer" data-speed="0.14">
      <span class="petal petal-1">🌸</span>
      <span class="petal petal-2">🌼</span>
      <span class="petal petal-3">🌿</span>
      <span class="petal petal-4">🌸</span>
      <span class="petal petal-5">🌷</span>
    </div>
  </div>

  <div id="app">

    <!-- ═══ SPLASH — 3D-blommande intro ═══ -->
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash-inner">
        <div class="splash-flower" aria-hidden="true">
          <span class="fl-petal" style="--i:0"></span>
          <span class="fl-petal" style="--i:1"></span>
          <span class="fl-petal" style="--i:2"></span>
          <span class="fl-petal" style="--i:3"></span>
          <span class="fl-petal" style="--i:4"></span>
          <span class="fl-petal" style="--i:5"></span>
          <span class="fl-core"></span>
        </div>
        <h1 class="splash-name">Blompasset</h1>
        <p class="splash-sub">S-blommor · Uddevalla/Kuröd</p>
        <p class="splash-story">Varje dag börjar med en blomma.</p>
        <div class="splash-loader"><span></span><span></span><span></span></div>
        <div class="splash-enter">
          <p class="splash-enter-hint">Tryck var som helst för att öppna</p>
        </div>
      </div>
    </div>

    <!-- ═══ MAIN APP ═══ -->
    <div id="main-app" class="main-app hidden">

      <!-- Content column (wraps header + alerts + pages for correct layout) -->
      <div class="content-col">

      <!-- Header -->
      <header class="app-header" id="app-header">
        <div class="header-inner">
          <div class="header-title-group">
            <span class="header-bloom" aria-hidden="true">🌸</span>
            <span class="header-title">Blompasset</span>
          </div>
          <div class="header-actions">
            <button class="sync-btn" id="save-btn" title="Datastatus" aria-label="Datastatus">
              <span class="sync-dot" id="save-dot" data-status="synced"></span>
              <span class="sync-label" id="save-label">Sparad</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Alerts banner -->
      <div id="alerts-banner" class="alerts-banner hidden" role="alert"></div>

      <!-- Page content -->
      <main class="page-content" id="page-content">

        <!-- ── START / DASHBOARD ── -->
        <section id="page-dashboard" class="page" data-page="dashboard" role="main">
          <div class="page-inner" id="dashboard-inner">
            <!-- Rendered by dashboard.js -->
          </div>
        </section>

        <!-- ── BLOMBILEN ── -->
        <section id="page-blombilen" class="page" data-page="blombilen" role="main">
          <div class="page-inner">
            <div class="page-header">
              <h2 class="page-title">🚐 Blombilen</h2>
              <div class="page-header-actions">
                <div class="filter-chips" id="blombilen-filter-chips">
                  <button class="chip active" data-filter="tomorrow">Imorgon</button>
                  <button class="chip" data-filter="today">Idag</button>
                  <button class="chip" data-filter="important">Viktiga</button>
                  <button class="chip" data-filter="all">Alla</button>
                </div>
              </div>
            </div>
            <div id="blombilen-list" class="item-list"></div>
            <button class="fab" id="add-blombilen-btn" aria-label="Lägg till blompost">
              <span>+</span>
            </button>
          </div>
        </section>

        <!-- ── PASS ── -->
        <section id="page-shifts" class="page" data-page="shifts" role="main">
          <div class="page-inner">
            <div class="page-header">
              <h2 class="page-title">📅 Arbetspass</h2>
              <div class="page-header-actions">
                <div class="filter-chips" id="shifts-filter-chips">
                  <button class="chip active" data-filter="upcoming">Kommande</button>
                  <button class="chip" data-filter="worked">Jobbade</button>
                  <button class="chip" data-filter="all">Alla</button>
                </div>
              </div>
            </div>
            <div id="shifts-list" class="item-list"></div>
            <button class="fab" id="add-shift-btn" aria-label="Lägg till arbetspass">
              <span>+</span>
            </button>
          </div>
        </section>

        <!-- ── LÖN ── -->
        <section id="page-salary" class="page" data-page="salary" role="main">
          <div class="page-inner" id="salary-inner">
            <!-- Rendered by salaryView.js -->
          </div>
        </section>

        <!-- ── INSTÄLLNINGAR ── -->
        <section id="page-settings" class="page" data-page="settings" role="main">
          <div class="page-inner" id="settings-inner">
            <!-- Rendered by settings.js -->
          </div>
        </section>

      </main>

      </div><!-- /content-col -->

      <!-- Bottom navigation -->
      <nav class="bottom-nav" id="bottom-nav" role="navigation" aria-label="Huvudmeny">
        <button class="nav-item" data-page="dashboard" aria-label="Start">
          <span class="nav-icon" aria-hidden="true">🏠</span>
          <span class="nav-label">Start</span>
        </button>
        <button class="nav-item" data-page="blombilen" aria-label="Blombilen">
          <span class="nav-icon" aria-hidden="true">🚐</span>
          <span class="nav-label">Blombilen</span>
        </button>
        <button class="nav-item" data-page="shifts" aria-label="Arbetspass">
          <span class="nav-icon" aria-hidden="true">📅</span>
          <span class="nav-label">Pass</span>
        </button>
        <button class="nav-item" data-page="salary" aria-label="Lön">
          <span class="nav-icon" aria-hidden="true">💰</span>
          <span class="nav-label">Lön</span>
        </button>
        <button class="nav-item" data-page="settings" aria-label="Inställningar">
          <span class="nav-icon" aria-hidden="true">⚙️</span>
          <span class="nav-label">Inställningar</span>
        </button>
      </nav>

    </div><!-- /main-app -->

  </div><!-- /app -->

  <!-- ═══ MODAL ═══ -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div id="modal-container" class="modal-container" tabindex="-1">
      <div class="modal-drag-handle" aria-hidden="true"></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- ═══ TOASTS ═══ -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
